<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content='width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no' name='viewport' />
    <title>WS scrcpy</title>
    <style>
        body.bare-mode, body.bare-mode.stream, body.bare-mode.shell { --stream-bg-color: #000 !important; --main-bg-color: #000 !important; --control-buttons-bg-color: #000 !important; --controls-bg-color: #000 !important; --header-bg-color: #000 !important; position: fixed !important; margin: 0 !important; padding: 0 !important; background: #000 !important; background-color: #000 !important; overflow: hidden !important; width: 100% !important; height: 100% !important; min-width: 100% !important; min-height: 100% !important; border: 0 !important; }
        body.bare-mode * { animation: none !important; transition: none !important; }
        body.bare-mode .control-buttons-list,
        body.bare-mode .control-button,
        body.bare-mode .control-wrapper,
        body.bare-mode .more-box,
        body.bare-mode .toolbox,
        body.bare-mode .device-list,
        body.bare-mode nav,
        body.bare-mode header,
        body.bare-mode footer,
        body.bare-mode .device-view > *:not(.video):not(.video-layer):not(.touch-layer) { display: none !important; visibility: hidden !important; width: 0 !important; height: 0 !important; opacity: 0 !important; pointer-events: none !important; position: absolute !important; left: -9999px !important; }
        body.bare-mode .device-view { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: auto !important; height: auto !important; margin: 0 !important; padding: 0 !important; float: none !important; display: block !important; z-index: 1 !important; overflow: hidden !important; background: #000 !important; }
        body.bare-mode .video,
        body.bare-mode .video video,
        body.bare-mode .video canvas,
        body.bare-mode .video img,
        body.bare-mode .video-layer,
        body.bare-mode .touch-layer { position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; max-width: none !important; max-height: none !important; min-width: 100% !important; min-height: 100% !important; margin: 0 !important; padding: 0 !important; float: none !important; display: block !important; object-fit: contain !important; background: #000 !important; }
    </style>
</head>
<body>
<script>
var h = location.hash.replace(/^#!/, '');
var q = new URLSearchParams(h);
console.log('bare-mode check', h, q.get('bare'));
if (q.get('bare') !== '1') return;
document.body.classList.add('bare-mode');
document.body.setAttribute('data-bare', '1');
document.title = '';
var sel = '.control-buttons-list,.control-button,.control-wrapper,.more-box,.toolbox,.device-list,nav,header,footer';
new MutationObserver(function (ms) {
    for (var i = 0; i < ms.length; i++) {
        var added = ms[i].addedNodes;
        for (var j = 0; j < added.length; j++) {
            var n = added[j];
            if (n instanceof HTMLElement) {
                if (n.matches(sel)) n.remove();
                var list = n.querySelectorAll(sel);
                for (var k = 0; k < list.length; k++) list[k].remove();
            }
        }
    }
}).observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
